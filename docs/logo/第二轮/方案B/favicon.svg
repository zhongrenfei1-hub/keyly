<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<!--
  方案 B「菱心 K」
  网格：模数 m = 10。记号 11m × 14m，所有点在整格上。
  边只有三种：横竖直边、45° 斜边、四分之一圆弧（半径 4m、3m）。
  竖条 4m 宽，左上角 R=4m；两条 45° 带子竖向跨度 6m，上臂末端 R=3m 收圆，下腿落平脚；
  菱心 = 两条带子伸进竖条后的交集，对角线 6m 的正菱形，左尖离竖条左边 1m，单独一块填最深一阶（不用混合模式）。
  小图标专用：画框 16m，16/32/48/64 像素下横竖边都对齐像素。
-->
<g transform="translate(30 10)"><path d="M0 140V40A40 40 0 0 1 40 0V140Z" fill="#38BDF8"/><path d="M40 40L80 0A30 30 0 0 1 110 30L70 70H40Z" fill="#0284C7"/><path d="M40 100L80 140H110V110L70 70H40Z" fill="#0284C7"/><path d="M10 70L40 40L70 70L40 100Z" fill="#0C4A6E"/></g>
</svg>

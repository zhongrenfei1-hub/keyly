<!--
  方案 B「菱心 K」
  网格：模数 m = 10。记号 11m × 14m，所有点在整格上。
  边只有三种：横竖直边、45° 斜边、四分之一圆弧（半径 4m、3m）。
  竖条 4m 宽，左上角 R=4m；两条 45° 带子竖向跨度 6m，上臂末端 R=3m 收圆，下腿落平脚；
  菱心 = 两条带子伸进竖条后的交集，对角线 6m 的正菱形，左尖离竖条左边 1m，单独一块填最深一阶（不用混合模式）。
-->

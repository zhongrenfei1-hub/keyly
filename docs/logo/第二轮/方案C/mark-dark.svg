<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Keyly 记号 · 方案 C「圆顶竖条 + 两臂 + 砖心菱形」（第二稿）
  网格：画布 512×512；记号 9 格宽 × 10 格高，一格 c = 40，即 360×400；左右各留 76，上下各留 56（记号高的 14%）。
  竖条宽 4c，左上角是半径 4c 的四分之一圆；上臂、下腿是竖向跨度 4c 的 45° 斜带，上臂头上是半径 2c 的四分之一圆，下腿和竖条平脚踩底线。
  两条带相叠出一颗对角线 4c 的菱形，左尖正在竖条中线上，单独画、直接填最深一阶（不用混合模式）。
  上、右、下三个三角缺口进深都是 3c。边只有三种：横竖直边、45° 斜边、四分之一圆弧；所有点都在格点上。 -->
  <!-- 深底版：最亮的一阶放在相叠处 -->
  <rect width="512" height="512" fill="#082F49"/>
  <path fill="#0284C7" d="M76 216A160 160 0 0 1 236 56L236 456L76 456Z"/>
  <path fill="#38BDF8" d="M236 176L356 56A80 80 0 0 1 436 136L316 256L236 256Z"/>
  <path fill="#38BDF8" d="M236 336L356 456L436 456L436 376L316 256L236 256Z"/>
  <path fill="#BAE6FD" d="M156 256L236 176L316 256L236 336Z"/>

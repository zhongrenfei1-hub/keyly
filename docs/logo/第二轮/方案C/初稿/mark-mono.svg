<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Keyly 记号 · 方案 C「咬三口的方砖」
  网格：画布 512×512，记号占中间 400×400 = 8×8 格（1 格 = 50），四周留白 56（记号高的 14%）。
  模数 m = 2 格 = 100。整块是 4m 见方的砖，被三个进深 1m 的三角缺口咬成 K。
  竖条 = 左半块（宽 2m），左上角半径 2m 的四分之一圆；两条斜臂是水平宽 2m 的 45° 带，上臂头上半径 1m 的四分之一圆，下臂和竖条的脚是直角，平踩底线。
  边只有三种：横竖直边、45° 斜边、四分之一圆弧。所有点都在格点上。
  两条臂带相叠出一颗对角线 2m 的菱形，正在砖心，单独画、直接填最深一阶（不用混合模式）。 -->
  <!-- 单色版：三块和菱形合成一条轮廓 -->
  <path fill="#075985" d="M56 256A200 200 0 0 1 256 56L256 156L356 56A100 100 0 0 1 456 156L356 256L456 356L456 456L356 456L256 356L256 456L56 456Z"/>

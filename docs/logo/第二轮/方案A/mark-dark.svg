<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 152">
<!--
  Keyly 记号「叶片 K」
  方格网：9 列 × 12 行，一格 = 10 单位（模数 u = 10），记号 90 × 120。所有点都落在整格上。
  边只有三种：横竖直边、45° 斜边、四分之一圆弧。
  竖条：宽 3u，左上角一段 r = 3u 的四分之一圆（正好吃掉整个顶边）。
  上臂、下腿：两条 45° 斜带，水平宽 4u（垂直于走向量是 2.83u，和竖条 3u 相当）。
  收头的规则：朝上的两个角是圆弧（竖条顶 r = 3u，上臂叶尖 r = 2u，正好连起斜带的两条边），
            落地的两个脚是直角（竖条脚、下腿脚都平踩在底线上，下腿脚的横边竖边各 2u）。
  两条斜带在竖条右边相叠，叠出一个直角等腰三角形（竖边 4u，尖朝右），单独画、填最深的一阶。
  三片：底片（竖条 + 下腿，浅）、叶片（上臂，中）、相叠处（三角，深）。底片和叶片都垫到三角底下，不留缝。
-->
<!-- 画布 152 × 152：记号按外框居中 translate(31 16)，上下留白 16（记号高的 13.3%），左右留白 31。 -->
<!-- 深底版：三阶重新挑过，相叠处最亮（#BAE6FD），不是反色。 -->
<rect width="152" height="152" fill="#082F49"/><g transform="translate(31 16)"><path fill="#0284C7" d="M0 30A30 30 0 0 1 30 0V40L90 100V120H70L30 80V120H0Z"/><path fill="#38BDF8" d="M30 40L70 0A20 20 0 0 1 90 20L30 80Z"/><path fill="#BAE6FD" d="M30 40L50 60L30 80Z"/></g>
</svg>

<!--
  Keyly 记号「叶片 K」· 小图标专用（顶部导航的小方标、浏览器标签页图标）
  和 mark.svg 是同一张 9 × 12 方格网、同样三块形状，只是画框收成 120 × 120：记号顶天立地，左右各留 15。
  这样 16 / 24 / 32 / 48 像素下，竖条两边、记号右沿、上下沿都正好压在像素线上，不发虚
